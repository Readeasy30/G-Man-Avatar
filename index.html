<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G-Man-Avatar Control Room</title>
  <script src="https://tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-amber-50/40 p-4 sm:p-8 font-sans antialiased text-stone-800 flex items-center justify-center">

  <!-- Core Dashboard Container -->
  <div class="max-w-xl w-full bg-white rounded-3xl p-8 border border-amber-100 shadow-xl space-y-6">
    
    
    <div class="text-center space-y-2">
      <div class="text-4xl">🕹️</div>
      <h1 class="text-3xl font-black text-stone-900 tracking-tight">G-Man-Avatar Engine</h1>
      <p class="text-sm text-stone-500 font-medium">Webmasters LLC Ultimate Cloud Core</p>
    </div>

    <!-- The 1-Button Start Trigger -->
    <div class="bg-gradient-to-br from-amber-100/50 to-orange-50 rounded-2xl p-6 border border-amber-200/40 text-center space-y-4">
      <p class="text-sm text-stone-600 leading-relaxed font-medium">
        Click below to open your direct manual actions console and run the DeepSeek build injection routines.
      </p>
      
      <!-- Direct Link Button to GitHub Actions Console -->
      <a href="https://github.com" target="_blank" 
         class="inline-block w-full py-4 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl transition-all shadow-md transform active:scale-95 text-center text-lg tracking-wide">
        🚀 LAUNCH PRODUCTION ENGINE
      </a>
    </div>

    <!-- Passive System Monitoring Status -->
    <div class="border-t border-stone-100 pt-4 flex justify-between items-center text-xs uppercase tracking-wider font-semibold text-stone-400">
      <span>Target Network: OmniRoute Edge</span>
      <span class="text-emerald-600 flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Ready
      </span>
    </div>

  </div>

</body>
</html>
